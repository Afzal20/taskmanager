name: taskly
description: "Taskly — a local-first, secure task manager for Android built with Flutter. Email/password auth with hashed credentials, per-user data isolation, and a hand-built live calendar."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10 # renders assets/logo_vector.svg in-app

  sqflite: ^2.4.2 # for database
  path: ^1.9.1 # for database path
  shared_preferences: ^2.3.0 # for auth session storage
  crypto: ^3.0.7 # PBKDF2 password hashing

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1 # generates Android launcher icons
  sqflite_common_ffi: ^2.3.4 # lets widget tests run the SQLite database on the host
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  image_path: assets/icon/logo_1024.png
  android: true
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: assets/icon/logo_foreground.png
  min_sdk_android: 21

# Flutter-specific configuration.
flutter:
  uses-material-design: true

  assets:
    - assets/logo_vector.svg
